name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install
        run: npm install

      - name: Test
        run: npm run test

      - name: Check i18n duplicate keys
        run: |
          node -e "
          const ko=require('fs').readFileSync('src/i18n/en.ts','utf8');
          const keys=[...ko.matchAll(/^\t\"((?:[^\"\\\\]|\\\\.)*)\":/gm)].map(m=>m[1]);
          const seen=new Set(),dups=[];for(const k of keys){seen.has(k)?dups.push(k):seen.add(k);}
          if(dups.length){console.error('Duplicate i18n keys:',dups);process.exit(1);}
          console.log('i18n keys:',keys.length,'dups: 0');
          "

      - name: Build
        run: npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title="$TAG" \
            --prerelease \
            --notes="Class Sync $TAG (beta). BRAT으로 설치해 테스트하세요. 자세한 내용은 README 참고." \
            main.js manifest.json styles.css
